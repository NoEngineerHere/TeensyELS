[platformio]
default_envs = native

[env]
extra_scripts = pre:scripts/build_identity.py

[els_teensy]
platform = teensy@6.0.0
platform_packages =
  platformio/framework-arduinoteensy@1.162.0
  platformio/toolchain-gccarmnoneeabi-teensy@1.150201.0
  platformio/tool-teensy@1.162.0
  platformio/tool-scons@4.41101.0
board = teensy41
build_type = release
framework = arduino
upload_protocol = teensy-cli
build_flags = -Iinclude -O2 -std=gnu++17
build_unflags = -Os
lib_deps =
  jsware/AbleButtons@0.4.0
  pfeerick/elapsedMillis@1.0.6

[els_esp32]
platform = espressif32@6.9.0
board = esp32dev
platform_packages =
  platformio/framework-arduinoespressif32@3.20017.0
  espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
  platformio/tool-esptoolpy@1.40501.0
  platformio/tool-scons@4.41101.0
build_type = debug
monitor_filters = esp32_exception_decoder
framework = arduino
board_build.partitions = default.csv
build_flags = -Iinclude -std=gnu++17 -DELS_COMPAT_PULSE_US=20 -Wl,-u,els_hardware_descriptor
build_unflags = -std=gnu++11
lib_deps =
  jsware/AbleButtons@0.4.0
  madhephaestus/ESP32Encoder@0.11.7
monitor_speed = 921600

[screen_gfx]
lib_deps =
  adafruit/Adafruit GFX Library@1.11.9
  adafruit/Adafruit BusIO@1.17.4

[screen_oled]
build_flags = -DELS_SCREEN=ELS_SCREEN_SSD1306_128X64
lib_deps =
  ${screen_gfx.lib_deps}
  adafruit/Adafruit SSD1306@2.5.10

[screen_tft]
build_flags = -DELS_SCREEN=ELS_SCREEN_ST7789_240X135
lib_deps =
  ${screen_gfx.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library@1.11.0

[screen_lvgl]
build_flags = -DELS_SCREEN=ELS_SCREEN_ST7789_320X240_LVGL -DLV_CONF_INCLUDE_SIMPLE
lib_deps =
  ${screen_tft.lib_deps}
  lvgl/lvgl@9.4.0

[env:teensy41]
extends = els_teensy
build_flags = ${els_teensy.build_flags} ${screen_oled.build_flags}
lib_deps = ${els_teensy.lib_deps}
  ${screen_oled.lib_deps}
custom_hardware_config = els/presets/teensy_direct.h

[env:teensy41_debug]
extends = env:teensy41
build_type = debug
build_flags = ${env:teensy41.build_flags} -DELS_PROGRESS_TELEMETRY

[env:teensy41_pcb]
extends = env:teensy41
custom_hardware_config = els/presets/teensy_pcb.h

[env:esp32dev]
extends = els_esp32
board = lilygo-t-display
build_flags = ${els_esp32.build_flags} ${screen_tft.build_flags}
lib_deps = ${els_esp32.lib_deps}
  ${screen_tft.lib_deps}
custom_hardware_config = els/presets/lilygo.h

[env:esp32_halfnut]
extends = els_esp32
build_flags = ${els_esp32.build_flags} ${screen_lvgl.build_flags}
lib_deps = ${els_esp32.lib_deps}
  ${screen_lvgl.lib_deps}
custom_hardware_config = els/presets/halfnut.h

[env:esp32_oled]
extends = els_esp32
build_flags = ${els_esp32.build_flags} ${screen_oled.build_flags}
lib_deps = ${els_esp32.lib_deps}
  ${screen_oled.lib_deps}
custom_hardware_config = els/presets/esp32_oled.h

[env:teensy41_tft]
extends = els_teensy
build_flags = ${els_teensy.build_flags} ${screen_tft.build_flags}
lib_deps = ${els_teensy.lib_deps}
  ${screen_tft.lib_deps}
custom_hardware_config = els/presets/teensy_tft.h

[env:teensy41_lvgl]
extends = els_teensy
build_flags = ${els_teensy.build_flags} ${screen_lvgl.build_flags}
lib_deps = ${els_teensy.lib_deps}
  ${screen_lvgl.lib_deps}
custom_hardware_config = els/presets/teensy_lvgl.h

[native_test]
build_flags = -Iinclude -std=gnu++17 -pthread -DPIO_UNIT_TESTING=1 -DELS_PROGRESS_TELEMETRY -Itest/mocks/display -Itest/mocks/buttons -Ilib/clock -Ilib/board -Ilib/update -Itest/fixtures -DELS_NATIVE_PROCESSOR=Processor::Teensy41

[env:native]
platform = native@1.2.1
test_framework = googletest
test_filter = test_core
build_type = debug
build_flags = ${native_test.build_flags} ${screen_oled.build_flags}
custom_hardware_config = native_direct.h
lib_compat_mode = off
platform_packages = platformio/tool-scons@4.41101.0
debug_build_flags = -O0 -g
lib_deps =
  google/googletest@1.17.0
  jsware/AbleButtons@0.4.0

[env:native_sanitized]
extends = env:native
build_flags = ${env:native.build_flags} -fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer

[env:native_lvgl]
extends = env:native
test_filter = test_lvgl
build_flags = ${native_test.build_flags} ${screen_lvgl.build_flags} -DELS_TEST_TEENSY_BUS
lib_deps = ${env:native.lib_deps}
  lvgl/lvgl@9.4.0
custom_hardware_config = native_lvgl.h
