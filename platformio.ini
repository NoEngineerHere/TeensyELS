[platformio]
default_envs = native

[env]
extra_scripts = pre:scripts/build_identity.py

[env:teensy41]
platform = teensy@6.0.0
platform_packages =
  platformio/framework-arduinoteensy@1.162.0
  platformio/toolchain-gccarmnoneeabi-teensy@1.150201.0
  platformio/tool-teensy@1.162.0
  platformio/tool-scons@4.41101.0
board = teensy41
build_type = release
framework = arduino
upload_protocol = teensy-cli
build_flags = -O2
build_unflags = -Os
lib_deps =
  jsware/AbleButtons@0.4.0
  adafruit/Adafruit GFX Library@1.11.9
  adafruit/Adafruit SSD1306@2.5.10
  pfeerick/elapsedMillis@1.0.6
  adafruit/Adafruit BusIO@1.17.4

[env:teensy41_debug]
extends = env:teensy41
build_type = debug

[env:esp32dev]
platform = espressif32@6.9.0
board = lilygo-t-display
platform_packages =
  platformio/framework-arduinoespressif32@3.20017.0
  espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
  platformio/tool-esptoolpy@1.40501.0
  platformio/tool-scons@4.41101.0
build_type = debug
monitor_filters = esp32_exception_decoder
framework = arduino
lib_deps =
  jsware/AbleButtons@0.4.0
  madhephaestus/ESP32Encoder@0.11.7
  khoih-prog/ESP32TimerInterrupt@2.3.0
  bodmer/TFT_eSPI@2.5.43
  suculent/ESP32httpUpdate@2.1.145
monitor_speed = 921600

[env:native]
platform = native@1.2.1
test_framework = googletest
build_type = debug
build_flags = -std=c++17 -pthread -DPIO_UNIT_TESTING=1 -Itest/mocks/display
platform_packages = platformio/tool-scons@4.41101.0
debug_build_flags = -O0 -g
lib_deps = google/googletest@1.17.0

[env:native_sanitized]
extends = env:native
build_flags = ${env:native.build_flags} -fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer
